plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    // The Flutter Gradle Plugin must be applied after the Android Gradle plugin.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.codertent.cardigo"
    compileSdk = 36
    ndkVersion = "28.0.12433566"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.codertent.cardigo"
        minSdk = 29
        targetSdk = 36
        versionCode = 7
        versionName = "1.0.7"
    }

    // Keep native libraries uncompressed and 16 KB zip-aligned. AGP 8.5.1+
    // writes PAGE_ALIGNMENT_16K into the app bundle when this is false.
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true

            // Use default ProGuard rules + your custom rules in android/app/proguard-rules.pro
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

dependencies {
    // google_mlkit_text_recognition 0.12.x pulls text-recognition 16.0.0,
    // whose libmlkit_google_ocr_pipeline.so is aligned to 4 KB. Play rejects
    // that on Android 15+. 16.0.1 depends on bundled-common 17.0.0, which is
    // 16 KB aligned for arm64-v8a and x86_64.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}

configurations.configureEach {
    resolutionStrategy {
        force 'com.google.mlkit:text-recognition:16.0.1'
        force 'com.google.mlkit:text-recognition-bundled-common:17.0.0'
    }
}

flutter {
    source = "../.."
}
